<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGIS - Leaflet (3 basemaps)</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">WebGIS (Leaflet)</div>
      <div class="topbar__tools">
        <form id="zonaForm" class="search" autocomplete="off">
          <label class="search__label" for="zonaInput">Zona:</label>
          <input id="zonaInput" class="search__input" type="text" list="zonaList" placeholder="Ex.: 4" />
          <datalist id="zonaList"></datalist>
          <button class="search__btn" type="submit">Buscar</button>
          <button id="zonaClear" class="search__btn search__btn--ghost" type="button">Limpar</button>
        </form>
        <div id="zonaStatus" class="topbar__hint">Passe o mouse para ver os atributos.</div>
      </div>
    </header>

    <main class="main">
      <div id="map" class="map" aria-label="Mapa interativo"></div>
      <aside id="statsPanel" class="stats" aria-label="Totais por ano (filtro Zona)">
        <div class="stats__title">Totais (Zona filtrada)</div>
        <p id="statsMeta" class="stats__meta">Busque uma Zona para ver a soma.</p>
        <div id="eleitoresBox" class="eleitores-box" hidden>
          <div class="eleitores-box__label">Eleitores aptos</div>
          <div id="sumEleitoresAptos" class="eleitores-box__value">—</div>
        </div>
        <table class="stats__table">
          <thead>
            <tr>
              <th>Ano</th>
              <th>Soma</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>1998</td><td id="sum1998" class="stats__value">—</td></tr>
            <tr><td>2002</td><td id="sum2002" class="stats__value">—</td></tr>
            <tr><td>2006</td><td id="sum2006" class="stats__value">—</td></tr>
            <tr><td>2020</td><td id="sum2020" class="stats__value">—</td></tr>
          </tbody>
        </table>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
